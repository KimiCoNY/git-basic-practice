<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thư Viện Ảnh Du Lịch - Flexbox Gallery</title>
  <link rel="stylesheet" href="style9.css">
</head>
<body>

  <!-- Tiêu đề trang -->
  <header class="gallery-header">
    <h1>Bộ Sưu Tập Khoảnh Khắc Du Lịch</h1>
    <p>Ghi lại những hành trình và vẻ đẹp thiên nhiên qua lăng kính nhiếp ảnh.</p>
  </header>

  <!-- Khung chứa lưới ảnh Flexbox chính -->
  <main class="gallery-container">
    <div class="gallery-item">
      <img src="https://picsum.photos/id/1015/600/400" alt="Khung cảnh thung lũng sông và núi rừng hùng vĩ">
    </div>
    <div class="gallery-item">
      <img src="https://picsum.photos/id/1018/600/400" alt="Dãy núi đá nhô cao giữa buổi chiều tà">
    </div>
    <div class="gallery-item">
      <img src="https://picsum.photos/id/1025/600/400" alt="Chú chó nhỏ nằm quấn chăn ấm áp">
    </div>
    <div class="gallery-item">
      <img src="https://picsum.photos/id/1036/600/400" alt="Con đường mòn uốn lượn qua đồi cỏ mùa thu">
    </div>
    <div class="gallery-item">
      <img src="https://picsum.photos/id/1039/600/400" alt="Thác nước chảy xiết giữa rừng nguyên sinh">
    </div>
    <div class="gallery-item">
      <img src="https://picsum.photos/id/1043/600/400" alt="Cây phong đỏ rực rỡ bên bờ hồ tĩnh lặng">
    </div>
    <div class="gallery-item">
      <img src="https://picsum.photos/id/1050/600/400" alt="Cánh đồng hoa nở rộ dưới ánh nắng bình minh">
    </div>
    <div class="gallery-item">
      <img src="https://picsum.photos/id/1057/600/400" alt="Ngọn hải đăng đứng vững giữa sóng biển xanh ngắt">
    </div>
    <div class="gallery-item">
      <img src="https://picsum.photos/id/1062/600/400" alt="Đàn chim hải âu chao lượn trên nền trời hoàng hôn">
    </div>
  </main>

</body>
</html>
