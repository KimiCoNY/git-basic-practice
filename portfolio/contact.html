<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liên Hệ - Minh Dự</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">Minh Dự Portfolio</a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Trang Chủ</a></li>
          <li><a href="about.html">Giới Thiệu</a></li>
          <li><a href="projects.html">Dự Án</a></li>
          <li><a href="contact.html" class="active">Liên Hệ</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="contact-wrapper">
        <h1 class="page-title">Gửi Lời Nhắn</h1>

        <form action="#" method="POST">
          <div class="form-group">
            <label for="fullName">Họ và tên</label>
            <input type="text" id="fullName" name="fullName" required placeholder="Nhập họ và tên...">
          </div>

          <div class="form-group">
            <label for="emailAddress">Email</label>
            <input type="email" id="emailAddress" name="emailAddress" required placeholder="example@email.com">
          </div>

          <div class="form-group">
            <label for="userMessage">Lời nhắn</label>
            <textarea id="userMessage" name="userMessage" rows="5" required placeholder="Nội dung lời nhắn của bạn..."></textarea>
          </div>

          <button type="submit" class="btn">Gửi Đi</button>
        </form>

        <section class="social-links-area">
          <p>Hoặc kết nối trực tiếp với tôi qua:</p>
          <div class="social-nav">
            <a href="https://github.com" target="_blank" rel="noopener noreferrer">GitHub</a>
            <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer">LinkedIn</a>
            <a href="https://facebook.com" target="_blank" rel="noopener noreferrer">Facebook</a>
          </div>
        </section>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Minh Dự. Bảo lưu mọi quyền.</p>
    </div>
  </footer>
</body>
</html>
