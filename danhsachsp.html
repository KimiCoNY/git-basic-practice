<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Sản Phẩm</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f9f9f9;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            border-collapse: collapse;
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        th, td {
            padding: 12px 15px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #007bff;
            color: white;
            font-weight: bold;
        }

        /* Căn phải cột Giá và Số lượng cho đúng chuẩn hiển thị số liệu */
        td:nth-child(2),
        td:nth-child(3),
        th:nth-child(2),
        th:nth-child(3) {
            text-align: right;
        }

        /* Tạo hiệu ứng dòng xen kẽ (Zebra Striping) giúp dễ đọc */
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: #e9ecef;
        }
    </style>
</head>
<body>

    <h1>Danh sách sản phẩm</h1>

    <table>
        <thead>
            <tr>
                <th>Tên sản phẩm</th>
                <th>Giá (VNĐ)</th>
                <th>Số lượng</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Laptop Dell XPS 13</td>
                <td>25.000.000</td>
                <td>10</td>
            </tr>
            <tr>
                <td>Điện thoại iPhone 15 Pro</td>
                <td>28.990.000</td>
                <td>15</td>
            </tr>
            <tr>
                <td>Tai nghe Bluetooth Sony WH-1000XM5</td>
                <td>7.990.000</td>
                <td>25</td>
            </tr>
            <tr>
                <td>Bàn phím cơ Keychron K2</td>
                <td>1.850.000</td>
                <td>30</td>
            </tr>
            <tr>
                <td>Chuột không dây Logitech MX Master 3S</td>
                <td>2.450.000</td>
                <td>20</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
